# Metadata voor _nvict_build/release.py.
# Zie _nvict_build/README.md voor alle beschikbare velden.
#
# 2026-09-23: omgezet van de tkinter-build naar de PySide6 (Qt)-build -
# dit is de bewuste "cutover": vanaf nu bouwt/signt/uploadt deze pijplijn
# de Qt-versie onder dezelfde app_id/update-manifest, dus bestaande
# tkinter-2.5-gebruikers krijgen via hun update-checker de Qt-3.0-release
# aangeboden. NVict_Reader.py (tkinter) blijft zelf ongewijzigd en bouwt
# voortaan niet meer via deze pijplijn - version.py volgt vanaf nu de
# Qt-release-lijn en loopt daardoor bewust NIET meer gelijk met de
# hardcoded APP_VERSION in NVict_Reader.py (die blijft op 2.5 staan).

app_id: NVictReader
app_name: "NVict Reader"
app_publisher: "NVict Service"
app_url: "https://www.nvict.nl/software/NVict_Reader/"
app_copyright: "Copyright 2026 NVict Service"

# Bronbestanden
spec_file: NVict_Reader_Qt.spec
installer_script: NVict_Reader_Qt.iss
release_notes: release_notes.txt
icon: favicon.ico
version_module: version

# Output namen
exe_name: NVict_Reader_Qt.exe
# One-folder (onedir) build: PyInstaller zet de exe in dist/NVict_Reader_Qt/
exe_subdir: NVict_Reader_Qt
setup_name: NVict_Reader_Setup.exe
version_json_name: nvict_reader_version.json

# FTP — login zit al in /software/, dus /NVict_Reader = web /software/NVict_Reader/
ftp_subdir: /NVict_Reader
# Updates gaan in de GEDEELDE /updates map (naast de app-folders), niet per app
ftp_updates_subdir: /updates

# Explicite URLs
download_url: "https://www.nvict.nl/software/NVict_Reader/NVict_Reader_Setup.exe"
update_check_url: "https://www.nvict.nl/software/updates/nvict_reader_version.json"

setup_signed: false

# Microsoft Store (MSIX) — stap 'msix' bouwt Output/NVictReader.msix.
# Zet msix_enabled op true zodra Identity Name + Publisher bekend zijn:
# Partner Center → NVict Reader → Productbeheer → Productidentiteit
# ("Package/Identity/Name" en "Package/Identity/Publisher").
msix_enabled: false
msix_identity_name: ""
msix_publisher: ""
msix_publisher_display_name: "NVict Service"
msix_display_name: "NVict Reader"
msix_name: NVictReader.msix

# GitHub (bestaande repo — naam moet matchen met remote)
github_repo: nvict-pdf-reader
